server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Upload das planilhas pode passar de 1 MB
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rotas do React: qualquer caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets têm hash no nome, então podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # análise de planilha grande demora
    }
}
